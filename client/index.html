<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moba2D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="hud-left">
        <span id="hud-status"></span>
        <div id="hud-room" hidden>
          Room <strong id="hud-room-code"></strong>
          <button id="hud-copy-link" type="button">Copy link</button>
        </div>
      </div>
      <span id="hud-stats"></span>
    </div>

    <div id="hud-vitals" hidden>
      <div id="hud-respawn" hidden>Respawning in <strong id="hud-respawn-time"></strong></div>
      <div id="skill-bar" data-ui hidden>
        <div class="skill-slot" data-slot="0">
          <div class="skill-icon"></div>
          <div class="skill-cooldown"></div>
          <span class="skill-cd-text"></span>
          <kbd>Q</kbd>
          <span class="skill-name"></span>
        </div>
        <div class="skill-slot" data-slot="1">
          <div class="skill-icon"></div>
          <div class="skill-cooldown"></div>
          <span class="skill-cd-text"></span>
          <kbd>E</kbd>
          <span class="skill-name"></span>
        </div>
        <div class="skill-slot" data-slot="2">
          <div class="skill-icon"></div>
          <div class="skill-cooldown"></div>
          <span class="skill-cd-text"></span>
          <kbd>R</kbd>
          <span class="skill-name"></span>
        </div>
      </div>
      <div id="hud-hp">
        <div id="hud-hp-fill"></div>
        <span id="hud-hp-text"></span>
      </div>
    </div>

    <div id="lobby" hidden>
      <div class="lobby-card">
        <h1>Moba2D</h1>
        <button id="lobby-create" type="button" class="primary">Create game</button>
        <div class="lobby-divider">or join / create with a code</div>
        <form id="lobby-join">
          <input id="lobby-code" placeholder="ABCDE" autocomplete="off" spellcheck="false" />
          <button type="submit">Join</button>
        </form>
        <p id="lobby-error" role="alert"></p>
        <div class="lobby-divider">open rooms</div>
        <div id="lobby-rooms"></div>
      </div>
    </div>

    <div id="hero-picker" hidden>
      <div class="picker-panel">
        <h2>Choose your hero</h2>
        <div id="hero-list"></div>
        <p class="picker-hint">Click a hero or press its number · pick within 60 seconds or your seat is freed</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
