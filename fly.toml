# fly.toml app configuration file generated for geometry-legends on 2026-11-26T09:34:04Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#
app = 'geometry-legends'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CLIENT_IP_HEADER = "fly-client-ip"

[mounts]
  source = "moba_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
